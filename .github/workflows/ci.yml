name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MATRIX_ENV: ci
  MATRIX_DEBUG: "false"
  MATRIX_DEVELOPER_MODE: "true"
  MATRIX_DATA_DIR: ${{ github.workspace }}/.ci-data
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff, syntax + undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6.0"
      - name: Ruff
        run: ruff check .
      - name: Byte-compile every project Python file
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys, tempfile

          skip = {".venv", ".uv-cache", "external", "scripts", "node_modules", ".git"}
          bad = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  py_compile.compile(str(path), doraise=True, cfile=tempfile.mktemp(suffix=".pyc"))
              except py_compile.PyCompileError as exc:
                  bad.append(str(exc))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("All project Python files compile.")
          PY

  test:
    name: Tests (windows-latest, Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify application imports
        run: python -c "import api.server; print('api.server import OK')"
      - name: Run test suite
        run: python -m pytest tests/ -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore
